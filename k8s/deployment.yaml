apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskapi
  template:
    metadata:
      labels:
        app: taskapi
    spec:
      containers:
        - name: taskapi
          image: taskapi:latest
          envFrom:
            - configMapRef:
                name: taskapi-config
